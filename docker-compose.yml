version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - prowler_results:/tmp/prowler_results
      # AWS 자격증명 마운트 (로컬 개발용)
      - ~/.aws:/root/.aws:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  prowler_results:
